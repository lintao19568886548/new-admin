services:
  mysql:
    image: mysql:8.0
    ports:
      - '127.0.0.1:3306:3306'
    networks:
      - magic-network
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: magic # 可选，创建一个初始数据库
    volumes:
      - mysql_data:/var/lib/mysql
      - ./magic.sql:/docker-entrypoint-initdb.d/init.sql # 挂载 SQL 文件
    # command: --init-file=/docker-entrypoint-initdb.d/init.sql # 指定初始化文件
  nginx:
    image: nginx:latest
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./static:/usr/share/nginx/html/static
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../.acme.sh/yizuw.cn_ecc:/etc/nginx/certs/yizuw:ro
      - ./app:/app # <-- 新增：挂载共享卷到 Nginx 可访问路径
      - uploads_data:/usr/share/nginx/html/uploads # <-- 新增：挂载共享卷到 Nginx 可访问路径
    depends_on:
      - node
      - mysql
    networks:
      - magic-network

  node:
    image: node:22.14.0
    volumes:
      - ./node:/app
      - uploads_data:/app/public/uploads # <-- 新增：挂载共享卷到 Node.js 图片存储路径 (请确保 /app/uploads 是你后端实际存储图片的路径)
      - ./wechat:/app/wechat
    working_dir: /app
    environment:
      - PORT=5320
      - ACCESS_TOKEN_SECRET=access_prod_syxd_magic_secret
      - REFRESH_TOKEN_SECRET=refresh_prod_syxd_magic_secret
      - DATABASE_URL=mysql://root:123456@mysql:3306/magic?timezone=Asia/Shanghai
      - CENTER_DATABASE_URL=mysql://root:123456@mysql:3306/magic_center?timezone=Asia/Shanghai
      - PUBLIC_DATABASE_URL=mysql://root:123456@mysql:3306/public_magic?timezone=Asia/Shanghai
      - NOTICES_DATABASE_URL=mysql://root:123456@mysql:3306/spider?timezone=Asia/Shanghai
      - TZ=Asia/Shanghai # 后端时区
      - SMS_MCH_ID=1066338
      - SMS_APP_ID=10011751423821130
      - SMS_SIGN_NAME=东莞市宜租网络科技有限公司
      - SMS_SECRET_KEY=f5dc94c3b92944dead6edc2ad56d0294
      - DATABASE_CACHING_RSA_PUBLIC_KEY_BASE64=
      - WECHAT_APP_ID= # 微信服务号 AppID
      - WECHAT_APP_SECRET= # 微信服务号 AppSecret
      - WECHAT_OPEN_APP_ID= # 微信开放平台移动应用 AppID
      - WECHAT_PAY_MERCHANT_ID= # 微信支付商户号
      - WECHAT_PAY_API_V3_KEY= # 微信支付 API V3 密钥
      - WECHAT_PAY_CERT_SERIAL_NO= # 微信支付证书序列号
      - WECHAT_PAY_PUBLIC_KEY_ID= # 微信支付公钥 ID，格式 PUB_KEY_ID_...
      - WECHAT_PAY_PUBLIC_KEY_PATH= # 微信支付公钥文件路径
      - WECHAT_PAY_NOTIFY_URL=https://yizuw.cn/api/wechat/pay/notify
      - WECHAT_PAY_PRIVATE_KEY_PATH= # 微信支付私钥路径
      - TENANT_PROVISIONING_WORKER_ENABLED=true
      - TENANT_PROVISIONING_WORKER_INTERVAL_MS=5000
      - TENANT_PROVISIONING_STALE_AFTER_MS=600000
      - TENANT_PROVISIONING_CUSTOMER_ID_PREFIX=vip_u_
    command: node ./server/index.mjs
    depends_on:
      - mysql
    networks:
      - magic-network

  public_magic:
    image: node:22.14.0
    volumes:
      - ./public_node:/app
      - public_upload_data:/app/public/uploads # <-- 新增：挂载共享卷到 Node.js 图片存储路径 (请确保 /app/uploads 是你后端实际存储图片的路径)
    working_dir: /app
    environment:
      - PORT=5320
      - ACCESS_TOKEN_SECRET=access_public_prod_syxd_magic_secret
      - REFRESH_TOKEN_SECRET=refresh_public_prod_syxd_magic_secret
      - DATABASE_URL=mysql://root:123456@mysql:3306/public_magic?timezone=Asia/Shanghai
      - NOTICES_DATABASE_URL=mysql://root:123456@mysql:3306/spider?timezone=Asia/Shanghai
      - TZ=Asia/Shanghai # 后端时区
      - SMS_MCH_ID=1066338
      - SMS_APP_ID=10011751423821130
      - SMS_SIGN_NAME=东莞市宜租网络科技有限公司
      - SMS_SECRET_KEY=f5dc94c3b92944dead6edc2ad56d0294
    command: node ./server/index.mjs
    depends_on:
      - mysql
    networks:
      - magic-network

networks:
  magic-network:
    name: magic-network

volumes:
  mysql_data:
  uploads_data: {} # <-- 新增：定义共享数据卷
  public_upload_data: {} # <-- 新增：定义共享数据卷
