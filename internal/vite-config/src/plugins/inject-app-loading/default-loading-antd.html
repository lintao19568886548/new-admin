<style data-app-loading="inject-css">
  html {
    /* same as ant-design-vue/dist/reset.css setting, avoid the title line-height changed */
    line-height: 1.15;
  }

  .dark .loading {
    background-color: #0d0d10;
  }

  .dark .loading .title {
    color: rgb(255 255 255 / 85%);
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f4f7f9;
  }

  .loading.hidden {
    visibility: hidden;
    opacity: 0;
    transition: all 0.6s ease-out;
  }

  .loading .title {
    margin-top: 36px;
    font-size: 30px;
    font-weight: 600;
    color: rgb(0 0 0 / 85%);
  }

  .loading-message {
    display: none;
    max-width: 320px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.7;
    color: rgb(71 85 105 / 100%);
    text-align: center;
  }

  .dark .loading-message {
    color: rgb(203 213 225 / 100%);
  }

  .loading-action {
    display: none;
    height: 36px;
    padding-inline: 16px;
    margin-top: 16px;
    font-size: 14px;
    color: #fff;
    cursor: pointer;
    background: hsl(var(--primary, 210 100% 50%));
    border: 0;
    border-radius: 6px;
  }

  .loading.slow .loading-message,
  .loading.slow .loading-action {
    display: block;
  }

  .loading .loading-message::before {
    content: '当前网络较慢或设备正在解析资源，请稍候。如果长时间没有响应，可以重新加载页面。';
  }

  .is-ios .loading.slow .loading-message::before,
  .is-wechat-webview .loading.slow .loading-message::before {
    content: 'iPhone 或微信内置浏览器正在加载资源，请稍候。如果一直没有进入页面，可以重新加载。';
  }

  .loading.stalled .loading-message::before {
    content: '页面启动时间过长，可能是网络不稳定、缓存版本不一致或设备解析资源较慢。请重新加载页面。';
  }

  .loading.offline .loading-message::before,
  .is-offline .loading .loading-message::before {
    content: '当前设备处于离线状态，请检查网络后重新加载。';
  }

  .dot {
    position: relative;
    box-sizing: border-box;
    display: inline-block;
    width: 48px;
    height: 48px;
    margin-top: 30px;
    font-size: 32px;
    transform: rotate(45deg);
    animation: rotate-ani 1.2s infinite linear;
  }

  .dot i {
    position: absolute;
    display: block;
    width: 20px;
    height: 20px;
    background-color: hsl(var(--primary, 210 100% 50%));
    border-radius: 100%;
    opacity: 0.3;
    transform: scale(0.75);
    transform-origin: 50% 50%;
    animation: spin-move-ani 1s infinite linear alternate;
  }

  .dot i:nth-child(1) {
    top: 0;
    left: 0;
  }

  .dot i:nth-child(2) {
    top: 0;
    right: 0;
    animation-delay: 0.4s;
  }

  .dot i:nth-child(3) {
    right: 0;
    bottom: 0;
    animation-delay: 0.8s;
  }

  .dot i:nth-child(4) {
    bottom: 0;
    left: 0;
    animation-delay: 1.2s;
  }

  @keyframes rotate-ani {
    to {
      transform: rotate(405deg);
    }
  }

  @keyframes spin-move-ani {
    to {
      opacity: 1;
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <span class="dot"><i></i><i></i><i></i><i></i></span>
  <div class="title"><%= VITE_APP_TITLE %></div>
  <div class="loading-message"></div>
  <button
    class="loading-action"
    type="button"
    onclick="
      window.__vbenReloadApp
        ? window.__vbenReloadApp()
        : window.location.reload()
    "
  >
    重新加载
  </button>
</div>
