<style data-app-loading="inject-css">
  html {
    /* same as ant-design-vue/dist/reset.css setting, avoid the title line-height changed */
    line-height: 1.15;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f4f7f9;

    /* transition: all 0.8s ease-out; */
  }

  .loading.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
    transition: all 0.8s ease-out;
  }

  .dark .loading {
    background: #0d0d10;
  }

  .title {
    margin-top: 66px;
    font-size: 28px;
    font-weight: 600;
    color: rgb(0 0 0 / 85%);
  }

  .dark .title {
    color: #fff;
  }

  .loading-message {
    display: none;
    max-width: 320px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.7;
    color: rgb(71 85 105 / 100%);
    text-align: center;
  }

  .dark .loading-message {
    color: rgb(203 213 225 / 100%);
  }

  .loading-action {
    display: none;
    height: 36px;
    padding-inline: 16px;
    margin-top: 16px;
    font-size: 14px;
    color: #fff;
    cursor: pointer;
    background: hsl(var(--primary, 210 100% 50%));
    border: 0;
    border-radius: 6px;
  }

  .loading.slow .loading-message,
  .loading.slow .loading-action {
    display: block;
  }

  .loading .loading-message::before {
    content: '当前网络较慢或设备正在解析资源，请稍候。如果长时间没有响应，可以重新加载页面。';
  }

  .is-ios .loading.slow .loading-message::before,
  .is-wechat-webview .loading.slow .loading-message::before {
    content: 'iPhone 或微信内置浏览器正在加载资源，请稍候。如果一直没有进入页面，可以重新加载。';
  }

  .loading.stalled .loading-message::before {
    content: '页面启动时间过长，可能是网络不稳定、缓存版本不一致或设备解析资源较慢。请重新加载页面。';
  }

  .loading.offline .loading-message::before,
  .is-offline .loading .loading-message::before {
    content: '当前设备处于离线状态，请检查网络后重新加载。';
  }

  .loader {
    position: relative;
    width: 48px;
    height: 48px;
  }

  .loader::before {
    position: absolute;
    top: 60px;
    left: 0;
    width: 48px;
    height: 5px;
    content: '';
    background: hsl(var(--primary, 210 100% 50%) / 50%);
    border-radius: 50%;
    animation: shadow-ani 0.5s linear infinite;
  }

  .loader::after {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    content: '';
    background: hsl(var(--primary, 210 100% 50%));
    border-radius: 4px;
    animation: jump-ani 0.5s linear infinite;
  }

  @keyframes jump-ani {
    15% {
      border-bottom-right-radius: 3px;
    }

    25% {
      transform: translateY(9px) rotate(22.5deg);
    }

    50% {
      border-bottom-right-radius: 40px;
      transform: translateY(18px) scale(1, 0.9) rotate(45deg);
    }

    75% {
      transform: translateY(9px) rotate(67.5deg);
    }

    100% {
      transform: translateY(0) rotate(90deg);
    }
  }

  @keyframes shadow-ani {
    0%,
    100% {
      transform: scale(1, 1);
    }

    50% {
      transform: scale(1.2, 1);
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <div class="loader"></div>
  <div class="title"><%= VITE_APP_TITLE %></div>
  <div class="loading-message"></div>
  <button
    class="loading-action"
    type="button"
    onclick="
      window.__vbenReloadApp
        ? window.__vbenReloadApp()
        : window.location.reload()
    "
  >
    重新加载
  </button>
</div>
