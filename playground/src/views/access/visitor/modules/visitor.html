<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>访客登记</title>
    <style>
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 20px;
          border-radius: 12px;
        }

        h2 {
          margin-bottom: 25px;
          font-size: 1.6rem;
        }

        input,
        select,
        button {
          padding: 12px;
          font-size: 16px;
        }

        .form-group {
          margin-bottom: 20px;
        }
      }

      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f5f5f5;
      }

      .container {
        max-width: 600px;
        padding: 30px;
        margin: 20px auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 10%);
        animation: fade-in 0.5s ease-out;
      }

      h2 {
        position: relative;
        padding-bottom: 10px;
        margin-bottom: 30px;
        font-size: 2rem;
        color: #2c3e50;
        text-align: center;
      }

      h2::after {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 60px;
        height: 3px;
        content: '';
        background: linear-gradient(90deg, #4caf50, #45a049);
        border-radius: 2px;
        transform: translateX(-50%);
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        color: #2c3e50;
      }

      input,
      select {
        width: 100%;
        padding: 12px 15px;
        font-size: 16px;
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      input:focus,
      select:focus {
        background-color: #fff;
        border-color: #4caf50;
        outline: none;
        box-shadow: 0 0 0 3px rgb(76 175 80 / 20%);
      }

      input::placeholder {
        color: #adb5bd;
      }

      button {
        position: relative;
        width: 100%;
        padding: 14px;
        overflow: hidden;
        font-size: 16px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        background: linear-gradient(45deg, #4caf50, #45a049);
        border: none;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      button:hover {
        box-shadow: 0 5px 15px rgb(76 175 80 / 30%);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        cursor: not-allowed;
        background: #ccc;
      }

      /* 模态框样式 */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        visibility: hidden;
        background-color: rgb(0 0 0 / 50%);
        opacity: 0;
        transition:
          opacity 0.3s,
          visibility 0.3s;
      }

      .modal-overlay.show {
        visibility: visible;
        opacity: 1;
      }

      .modal-content {
        position: relative;
        width: 90%;
        max-width: 400px;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 10px rgb(0 0 0 / 20%);
      }

      .message {
        margin-bottom: 15px;
        font-size: 16px;
        text-align: center;
      }

      .message.success {
        color: #4caf50;
      }

      .message.error {
        color: #f44;
      }

      .modal-content button {
        display: block;
        width: auto;
        padding: 8px 16px;
        margin: 0 auto;
        color: white;
        cursor: pointer;
        border: none;
        border-radius: 4px;
      }

      .modal-content button.success {
        background-color: #4caf50;
      }

      .modal-content button.error {
        background-color: #f44;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>访客登记表</h2>
      <form id="visitorForm">
        <div class="form-group">
          <label for="name">姓名：</label>
          <input type="text" id="name" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="reason">来访原因：</label>
          <input type="text" id="reason" required />
        </div>

        <div class="form-group">
          <label for="plate">车牌号：</label>
          <input type="text" id="plate" placeholder="例：京A12345" />
        </div>

        <div class="form-group">
          <label for="phone">手机号：</label>
          <input
            type="tel"
            id="phone"
            pattern="[0-9]{11}"
            required
            inputmode="numeric"
            autocomplete="tel"
          />
        </div>

        <button type="submit" id="submitBtn">提交登记</button>
      </form>

      <!-- 结果消息模态框 -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
          <div class="message" id="resultMessage"></div>
          <button id="closeBtn">关闭</button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // 获取DOM元素
        const form = document.getElementById('visitorForm');
        const submitBtn = document.getElementById('submitBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const resultMessage = document.getElementById('resultMessage');
        const closeBtn = document.getElementById('closeBtn');

        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const parkId = urlParams.get('id') || 1;

        // 设置页面标题
        document.title = '访客登记';

        // 表单提交处理
        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          // 获取表单数据
          const visitorName = document.getElementById('name').value;
          const remark = document.getElementById('reason').value;
          const carNum = document.getElementById('plate').value;
          const phoneNumber = document.getElementById('phone').value;

          // 表单验证
          if (!visitorName) {
            showMessage('请输入姓名', 'error');
            return;
          }

          if (!phoneNumber || !/^1[3-9]\d{9}$/.test(phoneNumber)) {
            showMessage('请输入正确的手机号码', 'error');
            return;
          }

          // 禁用提交按钮
          submitBtn.disabled = true;
          submitBtn.textContent = '提交中...';

          // 准备提交数据
          const formData = {
            visitorName,
            remark,
            carNum,
            phoneNumber,
            parkId: Number(parkId),
            status: 0, // 进入状态
            registerTime: new Date().toISOString(),
          };

          try {
            // 发送数据到服务器
            const response = await fetch('/api/access/visitor', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(formData),
            });

            if (!response.ok) {
              throw new Error('网络响应不正常');
            }

            const result = await response.json();

            if (!result.error) {
              showMessage('访客登记成功', 'success');
              resetForm();
            } else {
              showMessage(result.message || '提交失败', 'error');
            }
          } catch (error) {
            console.error('提交错误:', error);
            showMessage('提交失败，请检查网络连接', 'error');
          } finally {
            // 恢复提交按钮
            submitBtn.disabled = false;
            submitBtn.textContent = '提交登记';
          }
        });

        // 关闭消息模态框
        closeBtn.addEventListener('click', function () {
          modalOverlay.classList.remove('show');
        });

        // 显示消息
        function showMessage(text, type) {
          resultMessage.textContent = text;
          resultMessage.className = 'message ' + type;
          closeBtn.className = type;
          modalOverlay.classList.add('show');

          // 3秒后自动关闭
          setTimeout(() => {
            modalOverlay.classList.remove('show');
          }, 3000);
        }

        // 重置表单
        function resetForm() {
          form.reset();
        }
      });
    </script>
  </body>
</html>
