# 定义 Nginx 用户和工作进程数
# user  nobody;
worker_processes 1;

# 错误日志配置 (可选)
error_log  /var/log/nginx/error.log;
error_log  /var/log/nginx/error.log  notice;
error_log  /var/log/nginx/error.log  info;

# PID 文件路径 (可选)
# pid        logs/nginx.pid;

events {
    worker_connections 1024; # 每个工作进程的最大连接数
}

http {
    # 包含 MIME 类型定义文件
    # 注意：在 Docker 容器中，路径通常是 /etc/nginx/mime.types
    include       /etc/nginx/mime.types;
    # 默认 MIME 类型
    default_type  application/octet-stream;

    # 确保 mjs 文件被正确识别为 JavaScript
    # Dockerfile 中可能已经处理，或者包含在 mime.types 中
    # 如果遇到问题，可以取消注释下面的 types 块
    # types {
    #   application/javascript  js mjs;
    #   text/css                css;
    #   text/html               html;
    # }

    # 开启高效文件传输模式
    sendfile        on;
    # tcp_nopush     on; # 优化 TCP 包发送 (可选)

    # 长连接超时时间
    keepalive_timeout  65;

    # Gzip 压缩配置 (可选, 参考文档 faq.md)
    # gzip on;
    # gzip_static on; # 需要 ngx_http_gzip_static_module
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # gzip_proxied any;
    # gzip_vary on;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_min_length 1000;

    # Brotli 压缩配置 (可选, 参考文档 faq.md)
    # brotli on; # 需要 ngx_brotli module
    # brotli_static on; # 需要 ngx_brotli module
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name yizuw.cn *.yizuw.cn; # 替换为你的域名
        # 可选：如果你使用 Certbot (Let's Encrypt)，需要保留此 location 以便续签
        location / {
            # 永久重定向 (301) 到 HTTPS 版本
            # $host 保留用户访问的域名 (your_domain.com 或 www.your_domain.com)
            # $request_uri 保留请求的路径和查询参数
            return 301 https://$host$request_uri;
        }
    }
    # 定义服务器
    server {
        # 监听 443 端口
        listen 443 ssl;
        # 服务器名
        server_name yizuw.cn *.yizuw.cn; # 替换为你的域名;
       
        # SSL 配置
        ssl_certificate /etc/nginx/certs/yizuw/fullchain.cer; # acme.sh 生成的完整证书链文件
        ssl_certificate_key /etc/nginx/certs/yizuw/yizuw.cn.key; # acme.sh 生成的私钥文件

        # 推荐的 SSL 安全配置 (根据需要调整)
        ssl_protocols TLSv1.2 TLSv1.3; # 禁用不安全的旧版本
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384'; # 推荐的安全加密套件
        ssl_prefer_server_ciphers on; # 服务器优先选择加密套件
        ssl_session_cache shared:SSL:10m; # SSL会话缓存
        ssl_session_timeout 10m;
        ssl_session_tickets off; # 禁用SSL会话票证，除非有特殊需求
        ssl_stapling on; # OCSP Stapling
        ssl_stapling_verify on; # 验证OCSP响应
        resolver 223.5.5.5 119.29.29.29 valid=300s; # 用于OCSP验证的DNS解析器
        resolver_timeout 5s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"; # HSTS，可选，开启后浏览器会强制使用HTTPS访问你的域名一年

        # 处理 /api 前缀的请求，转发到后端服务 (node 服务)
        location /api {
            # 将请求转发给名为 'node' 的服务监听的 5320 端口
            proxy_pass http://node:5320; # 使用服务名 'node' 连接容器

            # 设置代理请求头，以便后端获取真实客户端信息
            proxy_set_header Host $host; # 传递原始 Host 头
            proxy_set_header X-Real-IP $remote_addr; # 传递真实客户端 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递经过的代理服务器 IP 列表
            proxy_set_header X-Forwarded-Proto $scheme; # 传递原始请求协议 (http/https)

            # 可选：添加 CORS 头 (如果后端未处理)
            # add_header 'Access-Control-Allow-Origin' '*' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            # add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # 可选：处理 CORS 预检请求 (OPTIONS)
            # if ($request_method = 'OPTIONS') {
            #    add_header 'Access-Control-Max-Age' 1728000;
            #    add_header 'Content-Type' 'text/plain charset=UTF-8';
            #    add_header 'Content-Length' 0;
            #    return 204;
            # }
        }

        # 处理前端静态资源和 history 路由模式
        location / {
            # 静态文件根目录 (对应 docker-compose.yaml 中的 volume 挂载)
            root   /usr/share/nginx/html;
            # 默认首页文件
            index  index.html index.htm;
            # 处理 Vue Router history 模式，尝试匹配文件/目录，否则返回 index.html
            try_files $uri $uri/ /index.html;
        }



        # 定义错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
