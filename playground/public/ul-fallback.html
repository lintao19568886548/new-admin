<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open App</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #4b5563;
      }
      .tips {
        font-size: 14px;
      }
      .btn-group {
        margin-top: 20px;
        display: grid;
        gap: 10px;
      }
      button,
      a.btn {
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        padding: 12px 14px;
        text-align: center;
        text-decoration: none;
      }
      .btn-primary {
        background: #0f766e;
        color: #fff;
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #1f2937;
      }
      .small {
        margin-top: 14px;
        font-size: 12px;
        color: #6b7280;
        word-break: break-all;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Open App</h1>
        <p id="desc">If the app is installed, tap "Open App".</p>
        <p id="wechatTip" class="tips hidden">
          You are in WeChat. If opening fails, tap top-right and choose
          "Open in Browser".
        </p>

        <div class="btn-group">
          <button id="openBtn" class="btn-primary">Open App</button>
          <a
            id="storeBtn"
            class="btn btn-secondary"
            href="https://apps.apple.com/cn"
            >Download from App Store</a
          >
        </div>

        <p class="small" id="debugUrl"></p>
      </section>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var appStoreUrl =
          params.get('store') || 'https://apps.apple.com/cn/app/id0000000000';
        var universalLinkUrl = new URL(window.location.href);
        universalLinkUrl.searchParams.delete('store');
        var targetPath = window.location.pathname + window.location.search;
        var ua = navigator.userAgent || '';
        var isWechat = /MicroMessenger/i.test(ua);

        var wechatTipEl = document.getElementById('wechatTip');
        var openBtn = document.getElementById('openBtn');
        var storeBtn = document.getElementById('storeBtn');
        var debugUrl = document.getElementById('debugUrl');

        storeBtn.href = appStoreUrl;
        debugUrl.textContent = 'Current link: ' + window.location.href;

        if (isWechat) {
          wechatTipEl.classList.remove('hidden');
        }

        openBtn.addEventListener('click', function () {
          if (isWechat) {
            alert(
              'Please tap top-right and choose "Open in Browser", then open the app.',
            );
            return;
          }

          window.location.href = universalLinkUrl.toString();
          setTimeout(function () {
            window.location.href = appStoreUrl;
          }, 1800);
        });

        // Keep target path visible for troubleshooting.
        if (targetPath) {
          debugUrl.textContent = 'Target: ' + targetPath;
        }
      })();
    </script>
  </body>
</html>
